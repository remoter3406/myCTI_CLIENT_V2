name: Build und Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # packages.config (WebView2) und PackageReference (Tests) in einem Schritt wiederherstellen
      - name: Build
        run: msbuild myCTI_CLIENT.sln /restore /p:RestorePackagesConfig=true /p:Configuration=Release /v:m

      - name: Test
        run: dotnet test myCTI.Tests\myCTI.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: myCTI.Tests/TestResults/*.trx

      - name: myCTI.exe hochladen
        uses: actions/upload-artifact@v4
        with:
          name: myCTI
          path: |
            bin/Release/myCTI.exe
            bin/Release/myCTI.exe.config
            bin/Release/*.dll
            bin/Release/runtimes/**
